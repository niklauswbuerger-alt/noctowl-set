<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noctowl Set">
<meta name="theme-color" content="#0d0d1a">

<style>
:root {
  --bg:       #0d0d1a;
  --surface:  #13131f;
  --surface2: #1a1a2e;
  --surface3: #21213a;
  --border:   #2a2a45;
  --border2:  #3a3a5a;
  --text:     #e8e8f0;
  --text2:    #9090b0;
  --text3:    #5a5a80;
  --gold:     #f0c040;
  --gold2:    #c09020;
  --purple:   #8060d0;
  --purple2:  #5040a0;
  --green:    #30c080;
  --green2:   #1a8050;
  --green-bg: rgba(48,192,128,0.08);
  --red:      #e05050;
  --blue:     #4080e0;
  --blue-bg:  rgba(64,128,224,0.12);
  --amber:    #e09030;
  --amber-bg: rgba(224,144,48,0.12);
  --glow:     rgba(240,192,64,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); overscroll-behavior: none; }

/* ── HEADER ───────────────────────────────────────── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, #0a0a18 0%, #0d0d1a 100%);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.header-top {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px 8px;
}
.header-owl { font-size: 28px; filter: drop-shadow(0 0 8px rgba(240,192,64,0.5)); }
.header-titles { flex: 1; }
.header-title {
  font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
  background: linear-gradient(135deg, #f0c040, #c080ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.header-pct {
  font-size: 13px; font-weight: 700; color: var(--gold);
  background: rgba(240,192,64,0.1); border: 1px solid rgba(240,192,64,0.3);
  padding: 3px 10px; border-radius: 20px;
}
.progress-wrap { padding: 0 16px 12px; }
.progress-track { width: 100%; height: 4px; background: var(--surface3); border-radius: 2px; }
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--purple2), var(--gold));
  transition: width 0.4s ease; box-shadow: 0 0 6px rgba(240,192,64,0.4);
}
.header-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; }

/* ── FILTER TABS ──────────────────────────────────── */
.filter-tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 10px 14px; font-size: 12px; font-weight: 600;
  color: var(--text3); border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; letter-spacing: 0.02em;
  transition: color 0.15s;
}
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── SEARCH ───────────────────────────────────────── */
.search-wrap { padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.search-input {
  width: 100%; padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface2);
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--purple); }
.search-input::placeholder { color: var(--text3); }

/* ── SECTION LABELS ───────────────────────────────── */
.section-label {
  padding: 14px 16px 6px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text3); display: flex; align-items: center; gap: 8px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── CARD LIST ────────────────────────────────────── */
.card-list { padding: 4px 10px 120px; }

.card-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  overflow: hidden;
  position: relative;
}
.card-row:active { transform: scale(0.99); }
.card-row.collected {
  background: rgba(48,192,128,0.06);
  border-color: rgba(48,192,128,0.3);
}
.card-row.shiny {
  border-color: var(--gold2);
  background: linear-gradient(135deg, var(--surface) 0%, rgba(240,192,64,0.06) 100%);
}
.card-row.shiny::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* Card inner layout */
.card-inner { display: flex; align-items: center; gap: 11px; padding: 10px 12px; }

/* Card image */
.card-img-wrap {
  width: 54px; height: 76px; flex-shrink: 0;
  border-radius: 6px; overflow: hidden;
  border: 1px solid var(--border2);
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-no-img { font-size: 28px; opacity: 0.5; }

/* Card info */
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 14px; font-weight: 700; letter-spacing: -0.2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}
.card-row.collected .card-name { text-decoration: line-through; color: var(--text3); }
.card-set { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-num { font-size: 10px; color: var(--text3); margin-top: 1px; }

/* Price tag */
.card-price {
  font-size: 13px; font-weight: 700; color: var(--green); margin-top: 4px;
}
.card-price-label { font-size: 10px; color: var(--text3); }

/* Badges row */
.card-badges { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.badge {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.badge-shiny { background: rgba(240,192,64,0.15); color: var(--gold); border: 1px solid rgba(240,192,64,0.3); }
.badge-promo { background: rgba(128,96,208,0.15); color: #a080e8; border: 1px solid rgba(128,96,208,0.3); }
.badge-jp    { background: rgba(64,128,224,0.15); color: #6090e0; border: 1px solid rgba(64,128,224,0.3); }
.badge-en    { background: rgba(48,192,128,0.12); color: #40b880; border: 1px solid rgba(48,192,128,0.3); }
.badge-1st   { background: rgba(224,80,80,0.15); color: #e07070; border: 1px solid rgba(224,80,80,0.3); }
.badge-rare  { background: rgba(224,144,48,0.15); color: var(--amber); border: 1px solid rgba(224,144,48,0.3); }

/* Right side */
.card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.check-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border2); background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.card-row.collected .check-circle { background: var(--green2); border-color: var(--green); box-shadow: 0 0 8px rgba(48,192,128,0.4); }
.check-icon { display: none; color: #fff; font-size: 14px; font-weight: 800; }
.card-row.collected .check-icon { display: block; }

/* Expandable details */
.card-detail {
  display: none; padding: 0 12px 12px;
  border-top: 1px solid var(--border);
  margin-top: 0;
}
.card-row.expanded .card-detail { display: block; }
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 10px; margin-top: 10px;
}
.detail-box {
  background: var(--surface2); border-radius: 8px; padding: 8px 10px;
  border: 1px solid var(--border);
}
.detail-label { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.detail-value { font-size: 14px; font-weight: 700; color: var(--text); margin-top: 2px; }
.detail-value.gold { color: var(--gold); }
.detail-value.green { color: var(--green); }
.detail-value.purple { color: #a080e8; }
.detail-note { font-size: 11px; color: var(--text3); margin-bottom: 10px; line-height: 1.5; }

/* Action buttons */
.action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.action-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 8px; border-radius: 8px; font-size: 12px; font-weight: 600;
  text-decoration: none; border: none; cursor: pointer; letter-spacing: 0.02em;
  transition: opacity 0.15s;
}
.action-btn:active { opacity: 0.7; }
.btn-buy {
  background: rgba(64,128,224,0.15); color: var(--blue);
  border: 1px solid rgba(64,128,224,0.35);
}
.btn-price {
  background: rgba(240,192,64,0.1); color: var(--gold);
  border: 1px solid rgba(240,192,64,0.3);
}
.btn-psa {
  background: rgba(224,80,80,0.1); color: #e08080;
  border: 1px solid rgba(224,80,80,0.3);
}
.btn-ebay {
  background: rgba(224,144,48,0.1); color: var(--amber);
  border: 1px solid rgba(224,144,48,0.3);
}

/* ── BOTTOM BAR ───────────────────────────────────── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(13,13,26,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; gap: 7px;
}
.bottom-btn {
  flex: 1; padding: 10px 6px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--surface2);
  font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text2);
  transition: all 0.15s;
}
.bottom-btn:active { opacity: 0.7; }
.bottom-btn.danger { color: var(--red); border-color: rgba(224,80,80,0.3); background: rgba(224,80,80,0.08); }

/* ── EMPTY STATE ──────────────────────────────────── */
.empty { text-align: center; padding: 60px 24px; color: var(--text2); }
.empty-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
.empty-text { font-size: 15px; font-weight: 600; }
.empty-sub { font-size: 13px; margin-top: 6px; color: var(--text3); }

/* ── INSTALL BANNER ───────────────────────────────── */
.install-banner {
  margin: 8px 10px;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 11px 14px;
  display: none; align-items: center; gap: 10px; font-size: 12px;
}
.install-close { margin-left: auto; color: var(--text3); font-size: 16px; cursor: pointer; padding: 4px; }

/* ── STAT SUMMARY BAR ─────────────────────────────── */
.summary-bar {
  display: flex; gap: 8px; padding: 8px 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.summary-bar::-webkit-scrollbar { display: none; }
.summary-pill {
  flex-shrink: 0; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; text-align: center;
}
.summary-pill .sp-val { font-size: 14px; font-weight: 700; color: var(--gold); }
.summary-pill .sp-lab { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
</style>
</head>

// ── APP STATE ──────────────────────────────────────────
var KEY = 'noctowl-master-v3';
var collected = new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
var currentFilter = 'all';
var searchQ = '';
var expandedId = null;

function save(){ try{localStorage.setItem(KEY,JSON.stringify([...collected]));}catch(e){} }

function updateStats(){
  var t=CARDS.length, d=collected.size, p=Math.round(d/t*100);
  document.getElementById('stats-text').textContent = d+' of '+t+' collected';
  document.getElementById('pct').textContent = p+'%';
  document.getElementById('prog').style.width = p+'%';
  document.getElementById('sum-collected').textContent = d;
  document.getElementById('sum-needed').textContent = t-d;
  var msg = p===100?'Complete! 🎉':p>75?'Almost there! 🔥':p>50?'Halfway done 💪':p>25?'Keep going! 🎯':'Start hunting! 🦉';
  document.getElementById('stats-right').textContent = msg;
}

function toggleCollected(id, e){
  e.stopPropagation();
  collected.has(id)?collected.delete(id):collected.add(id);
  save(); updateStats();
  var row = document.getElementById('cr-'+id);
  if(row) row.classList.toggle('collected', collected.has(id));
}

function toggleExpand(id){
  var row = document.getElementById('cr-'+id);
  if(!row) return;
  if(expandedId === id){
    row.classList.remove('expanded');
    expandedId = null;
  } else {
    if(expandedId !== null){
      var prev = document.getElementById('cr-'+expandedId);
      if(prev) prev.classList.remove('expanded');
    }
    row.classList.add('expanded');
    expandedId = id;
  }
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  expandedId = null;
  renderList();
}

function handleSearch(q){ searchQ = q.toLowerCase(); expandedId = null; renderList(); }

function getVisible(){
  return CARDS.filter(function(c){
    if(currentFilter==='en' && c.lang!=='en') return false;
    if(currentFilter==='jp' && c.lang!=='jp') return false;
    if(currentFilter==='needed' && collected.has(c.id)) return false;
    if(currentFilter==='collected' && !collected.has(c.id)) return false;
    if(currentFilter==='shiny' && !c.shiny) return false;
    if(currentFilter==='promo' && !c.promo) return false;
    if(searchQ && !c.name.toLowerCase().includes(searchQ) && !c.set.toLowerCase().includes(searchQ) && !c.num.toLowerCase().includes(searchQ)) return false;
    return true;
  });
}

function buildRow(c){
  var isColl = collected.has(c.id);
  var isExp  = expandedId === c.id;

  var imgHtml = c.img
    ? '<img class="card-img" src="'+c.img+'" alt="'+c.name+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'
    : '';
  var fallback = '<span class="card-no-img" style="display:'+(c.img?'none':'block')+'">🦉</span>';

  var badges = '';
  if(c.shiny)    badges += '<span class="badge badge-shiny">⭐ Shiny/Rare</span>';
  if(c.promo)    badges += '<span class="badge badge-promo">Promo</span>';
  if(c.lang==='jp') badges += '<span class="badge badge-jp">Japanese</span>';
  if(c.lang==='en') badges += '<span class="badge badge-en">English</span>';
  if(c.name.includes('1st Ed')) badges += '<span class="badge badge-1st">1st Edition</span>';

  // Determine buy button
  var buyLink = c.tcg || c.ebay || '#';
  var buyLabel = c.tcg ? '🛒 Buy on TCGPlayer' : '🛒 Buy on eBay';

  // PriceCharting link
  var pcLink = c.pc || null;

  // PSA link (search)
  var psaLink = 'https://www.psacard.com/psasmartgrades/index?specID=1&q='+encodeURIComponent(c.name+' '+c.set);

  var detail = '<div class="card-detail">'
    +'<div class="detail-grid">'
    +'<div class="detail-box"><div class="detail-label">NM Price (Raw)</div><div class="detail-value green">'+c.nmPrice+'</div></div>'
    +'<div class="detail-box"><div class="detail-label">PSA Population</div><div class="detail-value purple">'+(c.psaPop||'—')+'</div></div>'
    +'<div class="detail-box"><div class="detail-label">Graded Value</div><div class="detail-value gold">'+(c.psaGrade||'—')+'</div></div>'
    +'<div class="detail-box"><div class="detail-label">Year Released</div><div class="detail-value">'+c.year+'</div></div>'
    +'</div>'
    +'<div class="detail-note">'+c.note+'</div>'
    +'<div class="action-btns">'
    +'<a class="action-btn btn-buy" href="'+buyLink+'" target="_blank" onclick="event.stopPropagation()">'+buyLabel+'</a>'
    +(pcLink?'<a class="action-btn btn-price" href="'+pcLink+'" target="_blank" onclick="event.stopPropagation()">📊 Price Guide</a>':'<span class="action-btn btn-price" style="opacity:0.3">No price guide</span>')
    +'<a class="action-btn btn-psa" href="'+psaLink+'" target="_blank" onclick="event.stopPropagation()">🔴 PSA Lookup</a>'
    +(c.ebay && c.tcg?'<a class="action-btn btn-ebay" href="'+c.ebay+'" target="_blank" onclick="event.stopPropagation()">🟡 eBay Listings</a>':'')
    +'</div>'
    +'</div>';

  return '<div class="card-row'+(isColl?' collected':'')+(c.shiny?' shiny':'')+(isExp?' expanded':'')+'" id="cr-'+c.id+'" onclick="toggleExpand('+c.id+')">'
    +'<div class="card-inner">'
    +'<div class="card-img-wrap">'+imgHtml+fallback+'</div>'
    +'<div class="card-info">'
    +'<div class="card-name">'+c.name+'</div>'
    +'<div class="card-set">'+c.set+'</div>'
    +'<div class="card-num">'+c.num+' · '+c.rarity+'</div>'
    +'<div class="card-badges">'+badges+'</div>'
    +'</div>'
    +'<div class="card-right">'
    +'<div class="check-circle" onclick="toggleCollected('+c.id+',event)"><span class="check-icon">✓</span></div>'
    +'<div style="font-size:10px;color:var(--text3);margin-top:4px">'+(isColl?'<span style="color:var(--green)">✓ Got it</span>':'tap ↑ to check')+'</div>'
    +'</div>'
    +'</div>'
    +detail
    +'</div>';
}

function renderList(){
  var visible = getVisible();
  var list = document.getElementById('card-list');
  if(!visible.length){
    list.innerHTML = '<div class="empty"><div class="empty-icon">🦉</div><div class="empty-text">No cards found</div><div class="empty-sub">Try a different filter or search term</div></div>';
    return;
  }
  var html = '';
  var lastLang = '';
  visible.forEach(function(c){
    if((currentFilter==='all'||currentFilter==='needed'||currentFilter==='collected'||currentFilter==='shiny'||currentFilter==='promo') && c.lang!==lastLang){
      html += '<div class="section-label">'+(c.lang==='en'?'🇺🇸 English Cards':'🇯🇵 Japanese Cards')+'</div>';
      lastLang = c.lang;
    }
    html += buildRow(c);
  });
  list.innerHTML = html;
}

function markAllVisible(state){
  getVisible().forEach(function(c){ state?collected.add(c.id):collected.delete(c.id); });
  save(); updateStats(); renderList();
}

function resetAll(){
  if(!confirm('Reset ALL progress? This cannot be undone.')) return;
  collected.clear(); save(); updateStats(); renderList();
}

function dismissBanner(){
  document.getElementById('install-banner').style.display='none';
  localStorage.setItem('nb-dismissed','1');
}

// Install banner
if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && !localStorage.getItem('nb-dismissed')){
  document.getElementById('install-banner').style.display='flex';
}

// Service worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

// Init
renderList();
updateStats();
</script>
</body>
</html>
